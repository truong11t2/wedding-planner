<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{COUPLE_NAMES}} - {{ALBUM_TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            color: #333;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(252, 231, 243, 0.3) 0%, rgba(233, 213, 255, 0.3) 100%),
                        url({{HERO_BACKGROUND_IMAGE_URL}}) center/cover no-repeat;
            background-attachment: fixed;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            animation: fadeInUp 1.5s ease-out;
        }

        .heart-icon {
            font-size: 80px;
            color: #ec4899;
            margin-bottom: 20px;
            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .hero h1 {
            font-size: 5rem;
            background: linear-gradient(135deg, #db2777 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeInUp 1.5s ease-out 0.3s both;
        }

        .hero h2 {
            font-size: 2.5rem;
            color: #be36d3;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 15px;
            animation: fadeInUp 1.5s ease-out 0.6s both;
        }

        .hero .date {
            font-size: 2rem;
            color: #ffffff;
            animation: fadeInUp 1.5s ease-out 0.9s both;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gallery Section */
        .gallery-section {
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            color: #1f2937;
            margin-bottom: 50px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #ec4899 0%, #9333ea 100%);
            margin: 20px auto;
            border-radius: 2px;
        }

        /* Photo Container Styles */
        .photo-container {
            margin-bottom: 100px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease-out;
        }

        .photo-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Style 1: Full Width */
        .style-full {
            max-width: 1400px;
            margin: 0 auto 100px;
        }

        .style-full img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transition: transform 0.5s ease;
        }

        .style-full img:hover {
            transform: scale(1.02);
        }

        /* Style 2: Side by Side */
        .style-side-by-side {
            max-width: 1400px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .style-side-by-side img {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .style-side-by-side img:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        /* Style 3: Offset Stack */
        .style-offset {
            max-width: 1200px;
            margin: 0 auto 100px;
            position: relative;
            height: 700px;
        }

        .style-offset img:first-child {
            position: absolute;
            left: 0;
            top: 0;
            width: 60%;
            height: 550px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .style-offset img:last-child {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 60%;
            height: 550px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* Style 4: Vertical Portrait */
        .style-portrait {
            max-width: 800px;
            margin: 0 auto 100px;
        }

        .style-portrait img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        /* Style 5: Grid Layout */
        .style-grid {
            max-width: 1400px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .style-grid img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.4s ease;
        }

        .style-grid img:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        /* Style 6: Polaroid Style */
        .style-polaroid {
            max-width: 900px;
            margin: 0 auto 100px;
            transform: rotate(-2deg);
        }

        .style-polaroid .polaroid-frame {
            background: white;
            padding: 15px;
            padding-bottom: 60px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .style-polaroid img {
            width: 100%;
            height: auto;
            display: block;
        }

        .style-polaroid .caption {
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #4b5563;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        /* Style 7: Masonry Layout */
        .style-masonry {
            max-width: 1400px;
            margin: 0 auto 100px;
            column-count: 3;
            column-gap: 20px;
        }

        .style-masonry img {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.4s ease;
        }

        .style-masonry img:hover {
            transform: scale(1.03);
        }

        /* Caption Styles */
        .photo-caption {
            text-align: center;
            font-size: 1.5rem;
            color: #374151;
            margin-top: 25px;
            font-style: italic;
            padding: 0 20px;
        }

        /* Footer */
        .footer {
            background: linear-gradient(135deg, #fce7f3 0%, #e9d5ff 100%);
            padding: 60px 20px;
            text-align: center;
        }

        .footer .heart {
            font-size: 50px;
            color: #ec4899;
            margin-bottom: 20px;
        }

        .footer p {
            font-size: 1.3rem;
            color: #6b7280;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero h2 { font-size: 1.5rem; }
            .section-title { font-size: 2rem; }
            
            .style-side-by-side {
                grid-template-columns: 1fr;
            }
            
            .style-side-by-side img {
                height: 400px;
            }
            
            .style-offset {
                height: auto;
                position: relative;
            }
            
            .style-offset img:first-child,
            .style-offset img:last-child {
                position: relative;
                width: 100%;
                height: 400px;
                margin-bottom: 20px;
            }
            
            .style-grid {
                grid-template-columns: 1fr;
            }
            
            .style-grid img {
                height: 350px;
            }
            
            .style-masonry {
                column-count: 1;
            }
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: #ec4899;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="heart-icon">❤️</div>
            <h1>{{COUPLE_NAMES}}</h1>
            <h2>{{ALBUM_TITLE}}</h2>
            <h3 class="date">{{WEDDING_DATE}}</h3>
        </div>
        <div class="scroll-indicator">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2">
                <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <h2 class="section-title">Khoảnh Khắc Đáng Nhớ</h2>
        
        <!-- Photo containers will be inserted here -->
        <div id="photo-gallery"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="heart">💝</div>
        <p>Cảm ơn bạn đã chia sẻ niềm vui cùng chúng mình</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // Sample photos data structure
        // This will be replaced with actual album photos
        const albumPhotos = [
            {{PHOTOS_DATA}}
        ];

        // Layout styles that will be rotated through
        const layoutStyles = [
            'style-full',
            'style-portrait',
            'style-side-by-side',
            'style-offset',
            'style-grid',
            'style-polaroid',
            'style-masonry'
        ];

        function createPhotoHTML(photo, index) {
            const styleIndex = index % layoutStyles.length;
            const style = layoutStyles[styleIndex];
            
            let html = `<div class="photo-container ${style}" data-index="${index}">`;
            
            switch(style) {
                case 'style-full':
                case 'style-portrait':
                    html += `<img src="${photo.url}" alt="${photo.caption || ''}" onclick="openLightbox('${photo.url}')">`;
                    if (photo.caption) {
                        html += `<p class="photo-caption">${photo.caption}</p>`;
                    }
                    break;
                    
                case 'style-side-by-side':
                    // Use current photo and next photo if available
                    html += `<img src="${photo.url}" alt="${photo.caption || ''}" onclick="openLightbox('${photo.url}')">`;
                    if (albumPhotos[index + 1]) {
                        html += `<img src="${albumPhotos[index + 1].url}" alt="${albumPhotos[index + 1].caption || ''}" onclick="openLightbox('${albumPhotos[index + 1].url}')">`;
                    }
                    break;
                    
                case 'style-offset':
                    html += `<img src="${photo.url}" alt="${photo.caption || ''}" onclick="openLightbox('${photo.url}')">`;
                    if (albumPhotos[index + 1]) {
                        html += `<img src="${albumPhotos[index + 1].url}" alt="${albumPhotos[index + 1].caption || ''}" onclick="openLightbox('${albumPhotos[index + 1].url}')">`;
                    }
                    break;
                    
                case 'style-grid':
                    // Show 3 photos in grid
                    for (let i = 0; i < 3; i++) {
                        if (albumPhotos[index + i]) {
                            html += `<img src="${albumPhotos[index + i].url}" alt="${albumPhotos[index + i].caption || ''}" onclick="openLightbox('${albumPhotos[index + i].url}')">`;
                        }
                    }
                    break;
                    
                case 'style-polaroid':
                    html += `<div class="polaroid-frame">
                        <img src="${photo.url}" alt="${photo.caption || ''}" onclick="openLightbox('${photo.url}')">
                        ${photo.caption ? `<p class="caption">${photo.caption}</p>` : ''}
                    </div>`;
                    break;
                    
                case 'style-masonry':
                    // Show 3-4 photos in masonry
                    for (let i = 0; i < 4; i++) {
                        if (albumPhotos[index + i]) {
                            html += `<img src="${albumPhotos[index + i].url}" alt="${albumPhotos[index + i].caption || ''}" onclick="openLightbox('${albumPhotos[index + i].url}')">`;
                        }
                    }
                    break;
            }
            
            html += '</div>';
            return html;
        }

        function renderGallery() {
            const gallery = document.getElementById('photo-gallery');
            let html = '';
            let processedIndices = new Set();
            
            for (let i = 0; i < albumPhotos.length; i++) {
                if (processedIndices.has(i)) continue;
                
                const styleIndex = i % layoutStyles.length;
                const style = layoutStyles[styleIndex];
                
                html += createPhotoHTML(albumPhotos[i], i);
                
                // Mark indices as processed based on layout
                processedIndices.add(i);
                if (['style-side-by-side', 'style-offset'].includes(style)) {
                    processedIndices.add(i + 1);
                } else if (style === 'style-grid') {
                    processedIndices.add(i + 1);
                    processedIndices.add(i + 2);
                } else if (style === 'style-masonry') {
                    processedIndices.add(i + 1);
                    processedIndices.add(i + 2);
                    processedIndices.add(i + 3);
                }
            }
            
            gallery.innerHTML = html;
            
            // Trigger scroll animations
            setTimeout(() => {
                observeElements();
            }, 100);
        }

        // Intersection Observer for scroll animations
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1
            });

            document.querySelectorAll('.photo-container').forEach(el => {
                observer.observe(el);
            });
        }

        // Lightbox functions
        function openLightbox(src) {
            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox-img').src = src;
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Initialize gallery
        if (albumPhotos.length > 0) {
            renderGallery();
        }
    </script>
</body>
</html>
